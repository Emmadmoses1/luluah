name: Store maintenance
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call the maintenance endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --max-time 120 --retry 2 --retry-all-errors -sS -X POST "$SITE_URL/api/cron/maintenance" -H "Authorization: Bearer $CRON_SECRET"
